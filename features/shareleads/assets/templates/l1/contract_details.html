<ion-view class="shareleads-contract-details l1" sb-page-background cache-view="false">
    <ion-nav-title class="title title-center">
        {{ ::shareleads.page_title | translate:"shareleads" }}
    </ion-nav-title>
    <ion-nav-buttons side="right">
        <!-- Right button content goes here -->
        <button type="button" class="button button-icon icon ion-person-add" ng-click="navigateTo('shareleads-invitation')">
        </button>
    </ion-nav-buttons>
    <ion-content class="shareleads">
        <!-- <ion-refresher ng-show="is_logged_in" pulling-text="{{ ::'Pull to refresh...' | translate:'shareleads' }}" on-refresh="loadContent(true)"></ion-refresher> -->

        <div class="card" ng-show="!is_logged_in">
            <div class="item item-text-wrap padding-0">
                <p class="text-center font-weight-bold">{{ ::"You must be logged in to use this feature." | translate:"shareleads" }}</p>
                <div class="button-bar bar-stable m-top-10">
                    <a class="button" ng-click="loginModalMP();">{{ ::"Click here to login" | translate:"shareleads" }}</a>
                </div>
            </div>
        </div>
		<div class="row" ng-if="!is_loading">
			<div class="col">
				<button ng-if="shareleads.contract.file!=''" style="margin-bottom: 0px;" class="button button-block button-positive button-positive-custom ion-android-download" ng-click="downloadFile(shareleads.contract.file)">{{ ::"Download Contract" | translate:"shareleads" }}</button>
			</div>
		</div>
		<div class="list card" ng-if="!is_loading">
			<div class="item item-custom">
				<h2>{{shareleads.contract.contract_title}}</h2>
			</div>
			<div class="item item-body item-custom">
				<p ng-bind-html="trustedHTML(shareleads.contract.contract_description)"></p>
			</div>
		</div>

		<div style="margin-bottom: 30px;"></div>
    </ion-content>
	<style>
		.right-btn{
			position: absolute !important;
			right: 8px;
			top: 12px;
			font-size: 15px !important;
		}
	</style>
</ion-view>
